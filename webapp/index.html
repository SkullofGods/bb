<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1f2a">
<title>Опергруппа · Boom Beach</title>
<link rel="icon" href="img/headquarters.webp">
<link rel="stylesheet" href="css/app.css?v=8">
<script>
// Ставится до всего остального: если какой-то скрипт не выполнится,
// лучше показать причину, чем пустой экран
window.onerror = function (msg, src, line, col, err) {
  try {
    var where = (src || '').split('/').pop() + ':' + line;
    var text = (err && err.message) || msg || 'неизвестная ошибка';
    var box = document.getElementById('fatal') || document.createElement('div');
    box.id = 'fatal';
    box.style.cssText = 'position:fixed;inset:0;z-index:999;padding:24px 18px;'
      + 'background:#0a1a24;color:#eaf3f7;font:14px/1.5 -apple-system,system-ui,sans-serif;'
      + 'overflow:auto;-webkit-overflow-scrolling:touch';
    box.innerHTML = '<div style="font-weight:800;font-size:17px;margin-bottom:10px">'
      + 'Приложение не запустилось</div>'
      + '<div style="color:#8ba6b4;margin-bottom:14px">Покажи этот текст тому, кто делал приложение.</div>'
      + '<div style="background:rgba(255,255,255,.07);border-radius:10px;padding:12px;'
      + 'font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-word"></div>';
    box.lastChild.textContent = text + '\n' + where;
    if (!box.parentNode && document.body) document.body.appendChild(box);
  } catch (e) { /* совсем всё плохо */ }
};
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar">
    <button class="icon-btn off" id="btn-back" aria-label="Назад">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="topbar-title" id="topbar-title">Опергруппа</div>
    <button class="icon-btn" id="btn-search" aria-label="Поиск">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-backdrop" data-close="1"></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grab" data-close="1"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lb-close" aria-label="Закрыть">✕</button>
  <button class="lb-rot" id="lb-rot" aria-label="Повернуть">⟳</button>
  <img id="lb-img" alt="">
  <div class="lb-cap" id="lb-cap"></div>
</div>

<script src="js/data.js?v=8"></script>
<script src="js/ui.js?v=8"></script>
<script src="js/calc.js?v=8"></script>
<script src="js/views.js?v=8"></script>
<script src="js/app.js?v=8"></script>
</body>
</html>
